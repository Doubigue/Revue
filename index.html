<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Revue Juridique</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0D1B2A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Revue Juridique" />

  <!-- Polices élégantes -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet" />

  <style>
    /* ===========================
       VARIABLES & RESET
    =========================== */
    :root {
      --midnight: #0D1B2A;
      --navy: #162236;
      --navy-light: #1E3150;
      --gold: #C9A84C;
      --gold-light: #E4C87E;
      --gold-pale: #F5EED8;
      --ivory: #FAF7F2;
      --warm-white: #F0EBE1;
      --text-dark: #1A1A2E;
      --text-body: #2C3E50;
      --text-muted: #7A8A9A;
      --border: #D4C9A8;
      --border-dark: #3A4A5A;
      --serif-display: 'Playfair Display', Georgia, serif;
      --serif-body: 'EB Garamond', Georgia, serif;
      --serif-accent: 'Cormorant Garamond', Georgia, serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      background: var(--ivory);
      color: var(--text-body);
      font-family: var(--serif-body);
      font-size: 17px;
      line-height: 1.75;
      min-height: 100vh;
    }

    /* ===========================
       ÉCRAN DE VERROUILLAGE
    =========================== */
    #lock-screen {
      position: fixed; inset: 0; z-index: 9999;
      background: var(--midnight);
      display: flex; align-items: center; justify-content: center;
      padding: 2rem;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    #lock-screen.hidden {
      opacity: 0; pointer-events: none; transform: translateY(-20px);
    }

    .lock-card {
      background: linear-gradient(160deg, var(--navy) 0%, var(--midnight) 100%);
      border: 1px solid var(--border-dark);
      border-radius: 2px;
      padding: 3rem 2.5rem;
      max-width: 420px; width: 100%;
      text-align: center;
      box-shadow: 0 40px 80px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
    }

    .lock-card::before {
      content: '';
      position: absolute;
      top: 0; left: 50%; transform: translateX(-50%);
      width: 60%; height: 3px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .lock-logo {
      font-family: var(--serif-display);
      font-size: 0.75rem;
      letter-spacing: 0.35em;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .lock-title {
      font-family: var(--serif-display);
      font-size: 2rem;
      font-weight: 700;
      color: var(--ivory);
      line-height: 1.2;
      margin-bottom: 0.5rem;
    }

    .lock-subtitle {
      font-family: var(--serif-accent);
      font-style: italic;
      color: var(--text-muted);
      font-size: 1rem;
      margin-bottom: 2.5rem;
    }

    .lock-rule {
      width: 48px; height: 1px;
      background: var(--gold);
      margin: 1.5rem auto;
    }

    .lock-field {
      margin-bottom: 1rem;
    }

    .lock-field label {
      display: block;
      font-family: var(--serif-body);
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold-light);
      margin-bottom: 0.5rem;
      text-align: left;
    }

    .lock-field input {
      width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border-dark);
      border-radius: 1px;
      padding: 0.85rem 1rem;
      font-family: var(--serif-body);
      font-size: 1rem;
      color: var(--ivory);
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }

    .lock-field input:focus {
      border-color: var(--gold);
      background: rgba(201, 168, 76, 0.08);
    }

    .lock-field input::placeholder { color: rgba(255,255,255,0.25); }

    .lock-btn {
      width: 100%;
      margin-top: 1.5rem;
      padding: 1rem;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      border: none; cursor: pointer;
      font-family: var(--serif-display);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--midnight);
      border-radius: 1px;
      transition: opacity 0.2s, transform 0.15s;
    }

    .lock-btn:hover { opacity: 0.92; transform: translateY(-1px); }
    .lock-btn:active { transform: translateY(0); }

    .lock-error {
      color: #FF6B6B; font-size: 0.85rem;
      margin-top: 0.75rem; min-height: 1.2em;
    }

    /* ===========================
       EN-TÊTE DU JOURNAL
    =========================== */
    header {
      background: var(--midnight);
      color: var(--ivory);
      border-bottom: 1px solid var(--border-dark);
      position: sticky; top: 0; z-index: 100;
    }

    .header-top {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.6rem 1.5rem;
      border-bottom: 1px solid rgba(201, 168, 76, 0.2);
    }

    .header-dateline {
      font-family: var(--serif-body);
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .header-user {
      font-family: var(--serif-body);
      font-size: 0.8rem;
      color: var(--gold-light);
      cursor: pointer;
      display: flex; align-items: center; gap: 0.4rem;
    }

    .header-user:hover { color: var(--gold); }

    .header-main {
      text-align: center;
      padding: 1.2rem 1.5rem 1rem;
    }

    .header-kicker {
      font-family: var(--serif-body);
      font-size: 0.65rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 0.4rem;
    }

    .header-title {
      font-family: var(--serif-display);
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--ivory);
      line-height: 1;
    }

    .header-rule {
      display: flex; align-items: center; gap: 1rem;
      margin: 0.8rem 0 0.5rem;
    }

    .header-rule::before, .header-rule::after {
      content: ''; flex: 1; height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .header-rule-ornament {
      color: var(--gold); font-size: 0.9rem; letter-spacing: 0.3em;
    }

    .header-nav {
      display: flex; justify-content: center; gap: 2rem;
      padding: 0.5rem 1.5rem 0.8rem;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .header-nav::-webkit-scrollbar { display: none; }

    .header-nav a {
      font-family: var(--serif-body);
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
      text-decoration: none;
      white-space: nowrap;
      transition: color 0.2s;
    }

    .header-nav a:hover { color: var(--gold); }

    /* ===========================
       CONTENU PRINCIPAL
    =========================== */
    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4rem;
    }

    /* Loading State */
    .loading-state {
      text-align: center;
      padding: 5rem 1rem;
    }

    .loading-spinner {
      width: 36px; height: 36px;
      border: 2px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1.5rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      font-family: var(--serif-accent);
      font-style: italic;
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    /* Error State */
    .error-state {
      text-align: center;
      padding: 3rem 1rem;
      border: 1px solid #FFCCCC;
      background: #FFF5F5;
      border-radius: 2px;
    }

    .error-state h3 {
      font-family: var(--serif-display);
      color: #CC4444;
      margin-bottom: 0.5rem;
    }

    .error-state p { color: var(--text-muted); font-size: 0.9rem; }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 5rem 1rem;
    }

    .empty-state .ornament {
      font-size: 2rem; color: var(--border);
      margin-bottom: 1.5rem;
    }

    .empty-state h3 {
      font-family: var(--serif-display);
      font-size: 1.5rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .empty-state p { color: var(--text-muted); font-size: 0.95rem; }

    /* ===========================
       ARTICLE CARD
    =========================== */
    .article-card {
      background: #fff;
      border: 1px solid var(--border);
      margin-bottom: 3.5rem;
      box-shadow: 0 4px 24px rgba(13,27,42,0.06);
      animation: fadeUp 0.5s ease both;
      position: relative;
      overflow: hidden;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .article-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--midnight), var(--gold), var(--midnight));
    }

    /* Article Header */
    .article-header {
      background: var(--midnight);
      color: var(--ivory);
      padding: 2rem 2rem 1.5rem;
    }

    .article-meta {
      display: flex; align-items: center; gap: 1rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .article-cabinet {
      font-family: var(--serif-body);
      font-size: 0.68rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--gold);
    }

    .article-date {
      font-family: var(--serif-body);
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .article-title {
      font-family: var(--serif-display);
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 700;
      line-height: 1.25;
      color: var(--ivory);
      margin-bottom: 1rem;
    }

    .article-intro {
      font-family: var(--serif-accent);
      font-style: italic;
      font-size: 1.05rem;
      color: rgba(250,247,242,0.75);
      line-height: 1.6;
      border-left: 2px solid var(--gold);
      padding-left: 1rem;
    }

    .article-image {
      width: 100%;
      max-height: 320px;
      object-fit: cover;
      display: block;
    }

    /* Article Body */
    .article-body {
      padding: 2rem;
    }

    /* Blocs de contenu */
    .block-grand-titre {
      margin: 1.5rem 0 0.75rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    .block-grand-titre h2 {
      font-family: var(--serif-display);
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .block-sous-titre {
      font-family: var(--serif-accent);
      font-style: italic;
      font-size: 1.15rem;
      color: var(--text-muted);
      margin: 1rem 0 0.5rem;
    }

    .block-paragraphe {
      font-family: var(--serif-body);
      font-size: 1rem;
      line-height: 1.85;
      color: var(--text-body);
      margin-bottom: 1rem;
      text-align: justify;
    }

    .block-citation {
      margin: 1.5rem 0;
      padding: 1.25rem 1.5rem;
      background: var(--gold-pale);
      border-left: 4px solid var(--gold);
      font-family: var(--serif-accent);
      font-style: italic;
      font-size: 1.1rem;
      color: var(--text-dark);
      line-height: 1.6;
    }

    /* ===========================
       PIED D'ARTICLE (Likes & Commentaires)
    =========================== */
    .article-footer {
      border-top: 1px solid var(--border);
      padding: 1.5rem 2rem;
      background: var(--warm-white);
    }

    .article-interactions {
      display: flex; align-items: center; gap: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .like-btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: none;
      border: 1px solid var(--border);
      border-radius: 1px;
      padding: 0.5rem 1.1rem;
      font-family: var(--serif-body);
      font-size: 0.85rem;
      color: var(--text-body);
      cursor: pointer;
      transition: all 0.2s;
    }

    .like-btn:hover, .like-btn.liked {
      background: var(--midnight);
      border-color: var(--midnight);
      color: var(--gold);
    }

    .like-btn.liked { cursor: default; }

    .like-icon { font-size: 1.1rem; transition: transform 0.2s; }
    .like-btn:not(.liked):hover .like-icon { transform: scale(1.25); }

    .comment-count {
      font-family: var(--serif-body);
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Commentaires */
    .comments-section h4 {
      font-family: var(--serif-display);
      font-size: 0.9rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dark);
      margin-bottom: 1rem;
      display: flex; align-items: center; gap: 0.75rem;
    }

    .comments-section h4::after {
      content: ''; flex: 1; height: 1px;
      background: var(--border);
    }

    .comment-list {
      list-style: none;
      margin-bottom: 1.25rem;
    }

    .comment-item {
      padding: 0.9rem 0;
      border-bottom: 1px solid var(--border);
    }

    .comment-item:last-child { border-bottom: none; }

    .comment-author {
      font-family: var(--serif-body);
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--navy);
      letter-spacing: 0.05em;
      margin-bottom: 0.3rem;
    }

    .comment-date {
      font-family: var(--serif-body);
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-left: 0.5rem;
      font-weight: 400;
    }

    .comment-text {
      font-family: var(--serif-body);
      font-size: 0.95rem;
      color: var(--text-body);
      line-height: 1.6;
    }

    /* Formulaire de commentaire */
    .comment-form {
      display: flex; gap: 0.75rem; align-items: flex-start;
    }

    .comment-input {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 1px;
      padding: 0.65rem 0.9rem;
      font-family: var(--serif-body);
      font-size: 0.95rem;
      color: var(--text-body);
      background: #fff;
      resize: none;
      min-height: 44px;
      transition: border-color 0.2s;
    }

    .comment-input:focus {
      outline: none;
      border-color: var(--gold);
    }

    .comment-submit {
      padding: 0.65rem 1.2rem;
      background: var(--midnight);
      color: var(--gold);
      border: none; cursor: pointer;
      font-family: var(--serif-body);
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      border-radius: 1px;
      white-space: nowrap;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .comment-submit:hover { background: var(--navy-light); }
    .comment-submit:disabled { opacity: 0.5; cursor: wait; }

    /* ===========================
       DIVISEUR ENTRE ARTICLES
    =========================== */
    .article-divider {
      display: flex; align-items: center;
      gap: 1.5rem; margin: 1.5rem 0 3rem;
      color: var(--border);
      font-size: 0.8rem; letter-spacing: 0.3em;
    }

    .article-divider::before, .article-divider::after {
      content: ''; flex: 1; height: 1px;
      background: var(--border);
    }

    /* ===========================
       PIED DE PAGE
    =========================== */
    footer {
      background: var(--midnight);
      color: var(--text-muted);
      text-align: center;
      padding: 2.5rem 1.5rem;
      border-top: 1px solid var(--border-dark);
    }

    .footer-title {
      font-family: var(--serif-display);
      font-size: 1.1rem;
      color: var(--gold);
      margin-bottom: 0.4rem;
    }

    .footer-text {
      font-family: var(--serif-body);
      font-size: 0.8rem;
      line-height: 1.6;
    }

    .footer-rule {
      width: 40px; height: 1px;
      background: var(--border-dark);
      margin: 1rem auto;
    }

    /* ===========================
       TOAST NOTIFICATION
    =========================== */
    #toast {
      position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 9998;
      background: var(--midnight);
      color: var(--ivory);
      border-left: 3px solid var(--gold);
      padding: 0.9rem 1.5rem;
      font-family: var(--serif-body);
      font-size: 0.9rem;
      border-radius: 1px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      transform: translateX(120%);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #toast.show { transform: translateX(0); }

    /* ===========================
       RESPONSIVE
    =========================== */
    @media (max-width: 600px) {
      .article-header, .article-body, .article-footer {
        padding-left: 1.25rem;
        padding-right: 1.25rem;
      }

      .comment-form { flex-direction: column; }
      .comment-submit { width: 100%; text-align: center; }

      .header-nav { gap: 1.25rem; }
    }
  </style>
</head>
<body>

  <!-- ==========================================
       ÉCRAN DE VERROUILLAGE
  ========================================== -->
  <div id="lock-screen">
    <div class="lock-card">
      <div class="lock-logo">Publication Professionnelle</div>
      <h1 class="lock-title">Revue Juridique</h1>
      <p class="lock-subtitle">Doctrine · Jurisprudence · Actualité</p>
      <div class="lock-rule"></div>
      <p style="font-family: var(--serif-accent); font-style: italic; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2rem;">
        Veuillez vous identifier pour accéder aux publications
      </p>
      <div class="lock-field">
        <label for="input-prenom">Prénom</label>
        <input type="text" id="input-prenom" placeholder="Votre prénom" autocomplete="given-name" />
      </div>
      <div class="lock-field">
        <label for="input-nom">Nom</label>
        <input type="text" id="input-nom" placeholder="Votre nom de famille" autocomplete="family-name" />
      </div>
      <div class="lock-error" id="lock-error"></div>
      <button class="lock-btn" onclick="unlockApp()">Accéder à la revue</button>
    </div>
  </div>

  <!-- ==========================================
       EN-TÊTE
  ========================================== -->
  <header id="main-header" style="display:none;">
    <div class="header-top">
      <span class="header-dateline" id="header-date"></span>
      <span class="header-user" onclick="logoutUser()" title="Déconnexion">
        <span id="header-username"></span>
        <span style="font-size:0.9rem;">✕</span>
      </span>
    </div>
    <div class="header-main">
      <div class="header-kicker">Publication Professionnelle</div>
      <h1 class="header-title">REVUE JURIDIQUE</h1>
      <div class="header-rule">
        <span class="header-rule-ornament">✦ ✦ ✦</span>
      </div>
    </div>
    <nav class="header-nav">
      <a href="#">Doctrine</a>
      <a href="#">Jurisprudence</a>
      <a href="#">Actualité législative</a>
      <a href="#">Contrats</a>
      <a href="#">Procédure</a>
    </nav>
  </header>

  <!-- ==========================================
       CONTENU PRINCIPAL
  ========================================== -->
  <main id="main-content" style="display:none;">
    <div id="articles-container">
      <div class="loading-state">
        <div class="loading-spinner"></div>
        <p class="loading-text">Chargement des publications…</p>
